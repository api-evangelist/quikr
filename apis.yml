name: Quikr
description: >-
  Quikr is India's leading online classifieds platform, describing itself as
  "India's no. 1 online classifieds platform" for buying, selling, and renting
  across vehicles, real estate, jobs, mobiles, electronics, furniture, and 300+
  service categories, plus education, events, pets, and matrimonial listings.
  Quikr operates a portfolio of brands including CommonFloor, Hiree,
  IndiaProperty, and Zefo. The Quikr Developer Platform (QDP) exposes classifieds
  data and actions to approved partner apps through an invitation-only beta API
  at api.quikr.com, using custom HMAC-SHA1 signed request headers rather than
  OAuth. Quikr is backed by Norwest Venture Partners.
