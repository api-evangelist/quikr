openapi: 3.1.0
info:
  title: Quikr Developer (QDP) App Platform API
  version: v1
  description: 'Quikr Developer Platform (QDP) exposes India''s Quikr online classifieds to approved partner apps: discover ads by location or category, surface trending and live activity, reply to listings, and post/edit ads. The platform is in beta with invitation-only access (request via dvlpr-support@quikr.com). Authentication uses custom Quikr HMAC-SHA1 signed headers, not OAuth.'
  contact:
    name: Quikr Developer Support
    email: dvlpr-support@quikr.com
    url: https://developer.quikr.com
  x-access: invitation-only-beta
servers:
- url: https://api.quikr.com
  description: Quikr Developer Platform production API host (as documented)
security:
- quikrSignature: []
tags:
- name: Platform
paths:
  /platform/v1/userAds:
    post:
      operationId: getUserAds
      summary: Retrieve the authenticated user's posted ads.
      responses:
        '200':
          description: The user's ads.
      tags:
      - Platform
components:
  securitySchemes:
    quikrSignature:
      type: apiKey
      in: header
      name: X-Quikr-Signature-v2
      description: 'Custom Quikr request signing. Each request carries three headers: X-Quikr-App-Id (application identifier), X-Quikr-Token-Id (daily access token from /app/auth/access_token), and X-Quikr-Signature-v2 (HMAC-SHA1 signature). QDP helper libraries for Java and PHP generate these headers.'
